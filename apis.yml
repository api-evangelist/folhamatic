name: Folhamatic
description: Folhamatic (IOB Folhamatic Group) is a Brazilian developer of integrated accounting, payroll,
  and fiscal/tax software for accounting firms and businesses, founded in 1990 and headquartered in
  Americana, Sao Paulo. Its product line includes Folhamatic Payroll for personnel management and
  electronic files, Electronic Point Control for time-clock management, the Folhamatic Accounting
  system for management reporting, and Folhamatic Written Tax for tax departments. At acquisition it
  served more than 11,000 companies with 500-plus employees. Folhamatic was acquired by the UK's Sage
  Group in June 2012 and now operates as part of Sage in Brazil. The company publishes no first-party
  public developer API, and the historic folhamatic.com.br domain no longer serves a live site.
